      <path d="M651 250C753 118 888 145 972 224C1046 294 1122 274 1198 216V628C1087 703 982 724 863 684C754 647 689 688 613 779C576 825 517 821 494 776C469 727 505 669 537 631C588 570 578 500 563 443C544 372 595 322 651 250Z"/>
    </clipPath>
    <style>
      svg { background: #FBFCF6; }
      #blob, #seaGroup, #mapGroup, #compassGroup, #vanGroup, #goldDotA, #goldDotB, #hiker {
        transform-box: fill-box;
        transform-origin: center;
      }
      #blob { animation: blobFloat 12s ease-in-out infinite; }
      #seaGroup { animation: seaDrift 10s ease-in-out infinite; }
      #mapGroup { animation: mapFloat 8s ease-in-out infinite; }
      #compassGroup { animation: compassFloat 6.5s ease-in-out infinite; }
      #needle { animation: needlePulse 5.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #vanGroup { animation: vanRide 6s ease-in-out infinite; }
      #goldDotA { animation: dotWander 7s ease-in-out infinite; }
      #goldDotB { animation: dotPulse 5.5s ease-in-out infinite; }
      #routeLine { stroke-dasharray: 620; stroke-dashoffset: 0; animation: routeGlow 6.2s ease-in-out infinite; }
      #hiker { animation: hikerWave 4.2s ease-in-out infinite; }
      #blob, #seaGroup, #mapGroup, #compassGroup, #needle, #vanGroup, #goldDotA, #goldDotB, #routeLine, #hiker {
        animation: none !important;
      }
      @keyframes blobFloat {
        0%,100% { transform: translate(0,0) scale(1); }
        50% { transform: translate(12px,-10px) scale(1.018); }
      }
      @keyframes seaDrift {
        0%,100% { transform: translate(0,0); }
        50% { transform: translate(20px,-8px); }
      }
      @keyframes mapFloat {
        0%,100% { transform: translate(0,0) rotate(-7deg); }
        50% { transform: translate(8px,-14px) rotate(-4deg); }
      }
      @keyframes compassFloat {
        0%,100% { transform: translate(0,0) rotate(-1deg); }
        50% { transform: translate(0,-12px) rotate(2.4deg); }
      }
      @keyframes needlePulse {
        0%,100% { transform: rotate(-2deg); }
        50% { transform: rotate(8deg); }
      }
      @keyframes vanRide {
        0%,100% { transform: translate(0,0) rotate(0); }
        48% { transform: translate(-22px,-6px) rotate(-1deg); }
        74% { transform: translate(-12px,4px) rotate(.8deg); }
      }
      @keyframes dotWander {
        0%,100% { transform: translate(0,0) rotate(-18deg); }
        50% { transform: translate(16px,-16px) rotate(-8deg); }
      }
      @keyframes dotPulse {
        0%,100% { transform: scale(1); opacity:.92; }
        50% { transform: scale(1.08); opacity:1; }
      }
      @keyframes routeGlow {
        0%,100% { stroke-dashoffset: 0; opacity:.62; }
        50% { stroke-dashoffset: 95; opacity:.95; }
      }
      @keyframes hikerWave {
        0%,100% { transform: translate(0,0) rotate(-4deg); }
        50% { transform: translate(0,-9px) rotate(5deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

