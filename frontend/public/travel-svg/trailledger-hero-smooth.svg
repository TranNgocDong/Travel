<svg width="100%" height="100%" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet" fill="none" style="display:block;background:#FBFCF6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deepForest" x1="120" y1="760" x2="815" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#062F25"/>
      <stop offset=".45" stop-color="#0F4A39"/>
      <stop offset="1" stop-color="#2F6B50"/>
    </linearGradient>
    <linearGradient id="sea" x1="705" y1="206" x2="1138" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9F5DD"/>
      <stop offset=".34" stop-color="#68C9C3"/>
      <stop offset="1" stop-color="#177B72"/>
    </linearGradient>
    <linearGradient id="gold" x1="770" y1="86" x2="902" y2="215" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E3A0"/>
      <stop offset="1" stop-color="#A87B35"/>
    </linearGradient>
    <linearGradient id="paper" x1="368" y1="474" x2="813" y2="766" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF9E8"/>
      <stop offset=".46" stop-color="#9ED6C9"/>
      <stop offset="1" stop-color="#4F9E91"/>
    </linearGradient>
    <radialGradient id="compassFace" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(598 424) rotate(90) scale(156)">
      <stop stop-color="#FFF5C9"/>
      <stop offset=".72" stop-color="#F1DCA3"/>
      <stop offset="1" stop-color="#D4A95C"/>
    </radialGradient>
    <linearGradient id="metal" x1="458" y1="263" x2="746" y2="585" gradientUnits="userSpaceOnUse">
